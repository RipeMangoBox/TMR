defaults:
  - temos
  - _self_

_target_: src.model.tmr_d2b.TMRD2bFullMotionEncoder

motion_encoder:
  nfeats: ${data.motion_loader.nfeats}

motion_decoder:
  nfeats: ${data.motion_loader.nfeats}

lmd:
  global: 0.1
  evt_align: 1.0

lr: 1e-4
temperature: 0.1
threshold_selfsim: 0.80
threshold_selfsim_metrics: 0.95
event_align_tau: 0.1

# For multi-motion-rep comparison: warm-start from the original pretrained
# backbone directly (no D1 intermediate needed per motion rep).
warm_start_weights_dir: models/tmr_humanml3d_guoh3dfeats/last_weights
warm_start_ckpt: null
warm_start_event_head: false

freeze_motion_backbone: false
freeze_text_encoder: true
freeze_motion_decoder: true
