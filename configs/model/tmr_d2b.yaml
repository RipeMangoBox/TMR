defaults:
  - temos
  - _self_

_target_: src.model.tmr_d2b.TMRD2bFullMotionEncoder

# HumanML3D-E guoh3dfeats dimensionality
motion_encoder:
  nfeats: 263

motion_decoder:
  nfeats: 263

lmd:
  global: 0.1
  evt_align: 1.0

lr: 1e-4
temperature: 0.1
threshold_selfsim: 0.80
threshold_selfsim_metrics: 0.95
event_align_tau: 0.1

# Keep D2a's minimal-head recipe and only expand the motion unfreeze scope.
warm_start_weights_dir: RUN_DIR/stage4_1_realdata_e50_b128_d1/last_weights
warm_start_ckpt: null
warm_start_event_head: true

freeze_motion_backbone: false
freeze_text_encoder: true
freeze_motion_decoder: true
