defaults:
  - temos
  - _self_

_target_: src.model.tmr_p2a.TMRP2aFullMotionTextEncoder

motion_encoder:
  nfeats: ${data.motion_loader.nfeats}

motion_decoder:
  nfeats: ${data.motion_loader.nfeats}

lmd:
  global: 0.1
  evt_align: 1.0

lr: 1e-4
temperature: 0.1
threshold_selfsim: 0.80
threshold_selfsim_metrics: 0.95
event_align_tau: 0.1

# Phase 2 starts from the corrected Stage4.1 winner D2b.
warm_start_weights_dir: RUN_DIR/stage4_1_realdata_e50_b128_d2b/last_weights
warm_start_ckpt: null
warm_start_event_head: true

freeze_motion_backbone: false
freeze_text_encoder: false
freeze_motion_decoder: true
